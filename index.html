<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Sitio Web Local</title>
<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f4f4f4;
}

nav {
    background: #333;
    padding: 10px;
}

nav button {
    color: white;
    background: none;
    border: none;
    margin: 10px;
    cursor: pointer;
}

section {
    display: none;
    padding: 20px;
}

.active {
    display: block;
}
</style>
</head>

<body>

<nav>
    <button onclick="showSection('home')">Inicio</button>
    <button onclick="showSection('calc')">Calculadora</button>
    <button onclick="showSection('tasks')">Tareas</button>
    <button onclick="showSection('gallery')">Galería</button>
    <button onclick="showSection('contact')">Contacto</button>
</nav>

<section id="home" class="active">
    <h1>Bienvenido</h1>
    <p>Este es un sitio web con 5 módulos funcionales.</p>
</section>

<section id="calc">
    <h2>Calculadora</h2>
    <input type="number" id="num1">
    <input type="number" id="num2">
    <button onclick="sumar()">Sumar</button>
    <p id="resultado"></p>
</section>

<section id="tasks">
    <h2>Lista de tareas</h2>
    <input type="text" id="taskInput">
    <button onclick="addTask()">Agregar</button>
    <ul id="taskList"></ul>
</section>

<section id="gallery">
    <h2>Galería</h2>
    <img id="img" src="https://via.placeholder.com/200">
    <br><br>
    <button onclick="changeImage()">Cambiar Imagen</button>
</section>

<section id="contact">
    <h2>Contacto</h2>
    <input type="text" placeholder="Nombre"><br><br>
    <textarea placeholder="Mensaje"></textarea><br><br>
    <button onclick="enviar()">Enviar</button>
    <p id="msg"></p>
</section>

<script>
function showSection(id) {
    document.querySelectorAll("section").forEach(sec => {
        sec.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}

function sumar() {
    let n1 = Number(document.getElementById("num1").value);
    let n2 = Number(document.getElementById("num2").value);
    document.getElementById("resultado").innerText = "Resultado: " + (n1 + n2);
}

function addTask() {
    let task = document.getElementById("taskInput").value;
    let li = document.createElement("li");
    li.innerText = task;
    document.getElementById("taskList").appendChild(li);
}

function changeImage() {
    let img = document.getElementById("img");
    img.src = "https://picsum.photos/200?" + new Date().getTime();
}

function enviar() {
    document.getElementById("msg").innerText = "Mensaje enviado correctamente";
}
</script>

</body>
</html>
